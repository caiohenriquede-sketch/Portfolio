<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wait for the best...</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.25rem, 3vw, 2rem);
    font-weight: 300;
    letter-spacing: 0.02em;
  }
  .counter { display: flex; gap: clamp(1rem, 4vw, 2.5rem); }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .num {
    font-size: clamp(1.5rem, 5vw, 3rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    min-width: 2ch;
  }
  .label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #777;
  }
</style>
</head>
<body>
  <h1>Wait for the best...</h1>
  <div class="counter" aria-live="off">
    <div class="unit"><span class="num" id="d">00</span><span class="label">days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="label">hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="label">min</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="label">sec</span></div>
  </div>
<script>
  // Edit this date to set the launch target (local time).
  const TARGET = new Date("2026-12-31T00:00:00");
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    let diff = Math.max(0, TARGET - new Date());
    const s = Math.floor(diff / 1000);
    document.getElementById("d").textContent = pad(Math.floor(s / 86400));
    document.getElementById("h").textContent = pad(Math.floor(s % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(s % 3600 / 60));
    document.getElementById("s").textContent = pad(s % 60);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
