<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>building...</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    text-align: center;
  }

  .row { display: flex; align-items: flex-end; gap: 1.5rem; }

  /* Cute stacking blocks */
  .stack { position: relative; width: 72px; height: 100px; }
  .block {
    position: absolute;
    left: 4px;
    width: 64px;
    height: 28px;
    border-radius: 9px;
    opacity: 0;
    transform-origin: 50% 100%;
    animation: drop 3.6s cubic-bezier(.3,.7,.4,1) infinite;
  }
  .b1 { bottom: 0;    background: #6b6b6b; animation-delay: 0s; }
  .b2 { bottom: 32px; background: #b5b5b5; animation-delay: .5s; }
  .b3 { bottom: 64px; background: #f3f3f3; animation: drop-once 1s cubic-bezier(.3,.7,.4,1) 1s both; }
  .eyes { position: absolute; inset: 0; transition: transform .12s ease-out; }
  .eye {
    position: absolute;
    top: 10px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #000;
    animation: blink 3.6s infinite;
  }
  .eye.l { left: 22px; }
  .eye.r { right: 22px; }

  @keyframes drop {
    0%   { opacity: 0; transform: translateY(-70px) scale(1, 1); }
    10%  { opacity: 1; }
    20%  { transform: translateY(0) scale(1.08, .82); }
    27%  { transform: translateY(0) scale(.97, 1.06); }
    34%  { transform: translateY(0) scale(1, 1); }
    88%  { opacity: 1; transform: translateY(0) scale(1, 1); }
    96%, 100% { opacity: 0; transform: translateY(0) scale(1, 1); }
  }
  @keyframes drop-once {
    0%   { opacity: 0; transform: translateY(-70px) scale(1, 1); }
    35%  { opacity: 1; transform: translateY(0) scale(1, 1); }
    55%  { transform: translateY(0) scale(1.08, .82); }
    75%  { transform: translateY(0) scale(.97, 1.06); }
    100% { opacity: 1; transform: translateY(0) scale(1, 1); }
  }
  @keyframes blink {
    0%, 44%, 50%, 100% { transform: scaleY(1); }
    47% { transform: scaleY(.1); }
  }

  /* Text */
  .building {
    font-size: clamp(1.25rem, 3vw, 2rem);
    font-weight: 300;
    letter-spacing: 0.04em;
  }
  .dots span { opacity: .2; animation: dot 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%, 100% { opacity: .2; } 30% { opacity: 1; } }


  @media (prefers-reduced-motion: reduce) {
    .block { animation: none; opacity: 1; }
    .eye, .dots span { animation: none; }
    .dots span { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="row">
  <div class="stack" aria-hidden="true">
    <div class="block b1"></div>
    <div class="block b2"></div>
    <div class="block b3"><div class="eyes" id="eyes"><span class="eye l"></span><span class="eye r"></span></div></div>
  </div>

  <div class="building">building<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>


<script>
  // Eyes follow the mouse / finger
  const eyes = document.getElementById("eyes");
  const face = document.querySelector(".b3");
  function look(x, y) {
    const r = face.getBoundingClientRect();
    const dx = x - (r.left + r.width / 2);
    const dy = y - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy) || 1;
    const m = Math.min(1, dist / 160);
    eyes.style.transform =
      "translate(" + (dx / dist * 10 * m).toFixed(2) + "px," + (dy / dist * 4 * m).toFixed(2) + "px)";
  }
  window.addEventListener("pointermove", e => look(e.clientX, e.clientY));
  window.addEventListener("pointerleave", () => { eyes.style.transform = "translate(0,0)"; });
</script>
</body>
</html>
